server:
  port: 8083
  shutdown: graceful

spring:
  application:
    name: sportmatch-business
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/sportmatch_business
    username: ${DB_USER:sm_business}
    password: ${DB_PASSWORD:sm_business}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9094}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
  mvc:
    problemdetails:
      enabled: true

sportmatch:
  kafka:
    partitions: 3
    replicas: 1

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
