server:
  port: 8084
  shutdown: graceful

spring:
  application:
    name: sportmatch-admin
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/sportmatch_admin
    username: ${DB_USER:sm_admin}
    password: ${DB_PASSWORD:sm_admin}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
