server:
  port: 8086
  shutdown: graceful

spring:
  application:
    name: sportmatch-chat
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/sportmatch_chat
    username: ${DB_USER:sm_chat}
    password: ${DB_PASSWORD:sm_chat}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  mvc:
    problemdetails:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9094}
    consumer:
      auto-offset-reset: earliest
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

sportmatch:
  outbox:
    enabled: false
  chat:
    allowed-origins: ${CHAT_ALLOWED_ORIGINS:*}
  kafka:
    partitions: 3
    replicas: 1

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
