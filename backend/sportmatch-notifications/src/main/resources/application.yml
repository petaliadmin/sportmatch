server:
  port: 8085
  shutdown: graceful

spring:
  application:
    name: sportmatch-notifications
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/sportmatch_notifications
    username: ${DB_USER:sm_notifications}
    password: ${DB_PASSWORD:sm_notifications}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9094}
    consumer:
      auto-offset-reset: earliest
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
  mvc:
    problemdetails:
      enabled: true

sportmatch:
  kafka:
    partitions: 3
    replicas: 1

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
