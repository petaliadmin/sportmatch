openapi: 3.1.0
info:
  title: SportMatch — API joueurs (sportmatch-app)
  version: 1.0.0-beta
  description: |
    Contrat de référence de l'API v1 exposée via la gateway (http://localhost:8080 en local).
    Toute évolution passe d'abord par ce fichier (revue en PR), puis par le code.
    Le contrat généré à l'exécution est consultable sur http://localhost:8081/swagger-ui.html.
servers:
  - url: http://localhost:8080
    description: Gateway locale
security:
  - keycloak: []
paths:
  /api/v1/venues:
    get:
      summary: Lister les terrains
      security: []
      parameters:
        - { name: sport, in: query, required: false, schema: { type: string, example: FOOTBALL } }
      responses:
        "200":
          description: Terrains
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Venue" } }
  /api/v1/venues/{id}:
    get:
      summary: Détail d'un terrain
      security: []
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Terrain, content: { application/json: { schema: { $ref: "#/components/schemas/Venue" } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/matches:
    get:
      summary: Lister les matchs
      security: []
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [OPEN, FULL], default: OPEN } }
      responses:
        "200":
          description: Matchs
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Match" } }
    post:
      summary: Créer un match (l'organisateur y est inscrit d'office)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMatchRequest" }
      responses:
        "201": { description: Match créé, content: { application/json: { schema: { $ref: "#/components/schemas/Match" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { description: Jeton absent ou invalide }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/matches/{id}:
    get:
      summary: Détail d'un match
      security: []
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Match, content: { application/json: { schema: { $ref: "#/components/schemas/Match" } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/matches/{id}/join:
    post:
      summary: Rejoindre un match
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Inscription confirmée, content: { application/json: { schema: { $ref: "#/components/schemas/Match" } } } }
        "401": { description: Jeton absent ou invalide }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/notifications:
    get:
      summary: Mes notifications (servi par sportmatch-notifications)
      responses:
        "200":
          description: 50 dernières notifications
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Notification" } }
components:
  securitySchemes:
    keycloak:
      type: openIdConnect
      openIdConnectUrl: http://localhost:8180/realms/sportmatch/.well-known/openid-configuration
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
  responses:
    Problem:
      description: Erreur au format RFC 9457
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Venue:
      type: object
      required: [id, name, district, sport, pricePerHourFcfa]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Arena Almadies Five }
        district: { type: string, example: Almadies }
        sport: { type: string, example: FOOTBALL }
        pricePerHourFcfa: { type: integer, example: 30000 }
        rating: { type: number, example: 4.8 }
    CreateMatchRequest:
      type: object
      required: [venueId, sport, startsAt, durationMinutes, maxPlayers, level]
      properties:
        venueId: { type: string, format: uuid }
        sport: { type: string, example: FOOTBALL }
        startsAt: { type: string, format: date-time, description: Doit être dans le futur }
        durationMinutes: { type: integer, minimum: 30, maximum: 240 }
        maxPlayers: { type: integer, minimum: 2, maximum: 30 }
        level: { type: string, example: INTERMEDIATE }
    Match:
      type: object
      properties:
        id: { type: string, format: uuid }
        venueId: { type: string, format: uuid }
        venueName: { type: string }
        sport: { type: string }
        startsAt: { type: string, format: date-time }
        durationMinutes: { type: integer }
        maxPlayers: { type: integer }
        level: { type: string }
        organizerId: { type: string }
        status: { type: string, enum: [OPEN, FULL] }
        participants: { type: integer }
    Notification:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string }
        title: { type: string }
        body: { type: string }
        createdAt: { type: string, format: date-time }
        readAt: { type: [string, "null"], format: date-time }
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
