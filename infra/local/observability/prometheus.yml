global:
  scrape_interval: 15s
scrape_configs:
  - job_name: sportmatch
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - sportmatch-gateway:8080
          - sportmatch-app:8081
          - sportmatch-events:8082
          - sportmatch-business:8083
          - sportmatch-admin:8084
          - sportmatch-notifications:8085
          - sportmatch-chat:8086
