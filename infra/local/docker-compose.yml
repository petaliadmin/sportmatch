# SportMatch — environnement local complet (phase 1 du plan d'intégration)
# Lancer :  docker compose -f infra/local/docker-compose.yml up -d --build
# Avec Prometheus + Grafana :  ... --profile observability up -d --build
name: sportmatch

x-service: &service
  build:
    context: ../../backend
  restart: unless-stopped
  deploy:
    resources:
      limits:
        memory: 512M
  depends_on: &infra
    postgres:
      condition: service_healthy
    kafka:
      condition: service_healthy

x-env: &env
  DB_HOST: postgres
  KAFKA_BOOTSTRAP: kafka:9092
  JAVA_OPTS: "-XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError"

services:
  # ---------- Infrastructure ----------
  postgres:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Active PostGIS dans la base de sportmatch-app (superutilisateur requis). Idempotent :
  # rattrape aussi les volumes créés avant l'ajout de PostGIS.
  postgres-setup:
    image: postgis/postgis:16-3.4-alpine
    restart: "no"
    environment:
      PGPASSWORD: postgres
    command: ["psql", "-h", "postgres", "-U", "postgres", "-d", "sportmatch_app", "-v", "ON_ERROR_STOP=1",
              "-c", "CREATE EXTENSION IF NOT EXISTS postgis"]
    depends_on:
      postgres:
        condition: service_healthy

  kafka:
    image: apache/kafka:3.9.0
    ports: ["9094:9094"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports: ["8180:8080"]
    volumes:
      - ./keycloak/realm-sportmatch.json:/opt/keycloak/data/import/realm-sportmatch.json:ro

  kafka-ui:
    image: kafbat/kafka-ui:latest
    ports: ["8090:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: sportmatch-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025", "1025:1025"]

  # ---------- Microservices ----------
  sportmatch-gateway:
    <<: *service
    build:
      context: ../../backend
      args: { MODULE: sportmatch-gateway }
    image: sportmatch/sportmatch-gateway:local
    ports: ["8080:8080"]
    environment:
      JAVA_OPTS: "-XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError"
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/sportmatch/protocol/openid-connect/certs
      APP_URI: http://sportmatch-app:8081
      EVENTS_URI: http://sportmatch-events:8082
      BUSINESS_URI: http://sportmatch-business:8083
      ADMIN_URI: http://sportmatch-admin:8084
      NOTIFICATIONS_URI: http://sportmatch-notifications:8085
      CHAT_URI: http://sportmatch-chat:8086
    depends_on:
      sportmatch-app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 30

  sportmatch-app:
    <<: *service
    build:
      context: ../../backend
      args: { MODULE: sportmatch-app }
    image: sportmatch/sportmatch-app:local
    ports: ["8081:8081"]
    environment:
      <<: *env
    depends_on:
      <<: *infra
      postgres-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 30

  sportmatch-events:
    <<: *service
    build:
      context: ../../backend
      args: { MODULE: sportmatch-events }
    image: sportmatch/sportmatch-events:local
    ports: ["8082:8082"]
    environment:
      <<: *env
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 30

  sportmatch-business:
    <<: *service
    build:
      context: ../../backend
      args: { MODULE: sportmatch-business }
    image: sportmatch/sportmatch-business:local
    ports: ["8083:8083"]
    environment:
      <<: *env
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 30

  sportmatch-admin:
    <<: *service
    build:
      context: ../../backend
      args: { MODULE: sportmatch-admin }
    image: sportmatch/sportmatch-admin:local
    ports: ["8084:8084"]
    environment:
      <<: *env
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8084/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 30

  sportmatch-notifications:
    <<: *service
    build:
      context: ../../backend
      args: { MODULE: sportmatch-notifications }
    image: sportmatch/sportmatch-notifications:local
    ports: ["8085:8085"]
    environment:
      <<: *env
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8085/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 30

  sportmatch-chat:
    <<: *service
    build:
      context: ../../backend
      args: { MODULE: sportmatch-chat }
    image: sportmatch/sportmatch-chat:local
    ports: ["8086:8086"]
    environment:
      <<: *env
      REDIS_HOST: redis
    depends_on:
      <<: *infra
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8086/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 30

  # ---------- Observabilité (profil optionnel) ----------
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["observability"]
    ports: ["9090:9090"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.3.0
    profiles: ["observability"]
    ports: ["3001:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro

volumes:
  pgdata:
  kafkadata:
