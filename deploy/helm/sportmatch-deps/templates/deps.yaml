# ---------- Secrets d'accès aux bases (identiques à infra/local) ----------
{{- range .Values.databases }}
---
apiVersion: v1
kind: Secret
metadata:
  name: sportmatch-db-{{ . }}
type: Opaque
stringData:
  username: sm_{{ . }}
  password: sm_{{ . }}
{{- end }}
# ---------- PostgreSQL + PostGIS ----------
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  01-init-databases.sql: |-
{{ .Files.Get "files/init-databases.sql" | indent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      enableServiceLinks: false
      containers:
        - name: postgres
          image: {{ .Values.images.postgres }}
          env:
            - { name: POSTGRES_USER, value: postgres }
            - { name: POSTGRES_PASSWORD, value: postgres }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ containerPort: 5432 }]
          readinessProbe:
            exec: { command: ["pg_isready", "-h", "127.0.0.1", "-U", "postgres"] }
            periodSeconds: 5
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d }
      volumes:
        - name: init
          configMap: { name: postgres-init }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 2Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: postgres }
spec:
  selector: { app: postgres }
  ports: [{ port: 5432 }]
# ---------- Kafka (KRaft, 1 nœud) ----------
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: kafka }
spec:
  replicas: 1
  selector: { matchLabels: { app: kafka } }
  template:
    metadata: { labels: { app: kafka } }
    spec:
      enableServiceLinks: false
      containers:
        - name: kafka
          image: {{ .Values.images.kafka }}
          ports: [{ containerPort: 9092 }]
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0" }
            - { name: KAFKA_NUM_PARTITIONS, value: "3" }
          readinessProbe:
            tcpSocket: { port: 9092 }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata: { name: kafka }
spec:
  selector: { app: kafka }
  ports: [{ port: 9092 }]
# ---------- Redis ----------
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis }
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      enableServiceLinks: false
      containers:
        - name: redis
          image: {{ .Values.images.redis }}
          ports: [{ containerPort: 6379 }]
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
---
apiVersion: v1
kind: Service
metadata: { name: redis }
spec:
  selector: { app: redis }
  ports: [{ port: 6379 }]
# ---------- Keycloak (mode dev, realm de démonstration) ----------
---
apiVersion: v1
kind: ConfigMap
metadata: { name: keycloak-realm }
data:
  realm-sportmatch.json: |-
{{ .Files.Get "files/realm-sportmatch.json" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: keycloak }
spec:
  replicas: 1
  selector: { matchLabels: { app: keycloak } }
  template:
    metadata: { labels: { app: keycloak } }
    spec:
      enableServiceLinks: false
      containers:
        - name: keycloak
          image: {{ .Values.images.keycloak }}
          args: ["start-dev", "--import-realm"]
          env:
            - { name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin }
            - { name: KC_BOOTSTRAP_ADMIN_PASSWORD, value: admin }
            - { name: KC_HEALTH_ENABLED, value: "true" }
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /health/ready, port: 9000 }
            periodSeconds: 5
            failureThreshold: 60
          volumeMounts:
            - { name: realm, mountPath: /opt/keycloak/data/import }
      volumes:
        - name: realm
          configMap: { name: keycloak-realm }
---
apiVersion: v1
kind: Service
metadata: { name: keycloak }
spec:
  selector: { app: keycloak }
  ports: [{ port: 8080 }]
# ---------- Mailpit ----------
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: mailpit }
spec:
  replicas: 1
  selector: { matchLabels: { app: mailpit } }
  template:
    metadata: { labels: { app: mailpit } }
    spec:
      enableServiceLinks: false
      containers:
        - name: mailpit
          image: {{ .Values.images.mailpit }}
          ports: [{ containerPort: 1025 }, { containerPort: 8025 }]
---
apiVersion: v1
kind: Service
metadata: { name: mailpit }
spec:
  selector: { app: mailpit }
  ports:
    - { name: smtp, port: 1025 }
    - { name: http, port: 8025 }
