# Valeurs par défaut (communes). Surchargées par values-kind.yaml (répétition locale/CI)
# et values-staging.yaml (EKS).

image:
  registry: docker.io/petaliadmin   # préfixe : <registry>/<nom-du-service>:<tag>
  tag: "1.0.0-SNAPSHOT"
  pullPolicy: IfNotPresent

# Variables communes injectées dans tous les microservices Java
commonEnv:
  JAVA_OPTS: "-XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError"
  DB_HOST: postgres
  DB_PORT: "5432"
  KAFKA_BOOTSTRAP: kafka:9092

# Secret Kubernetes contenant les identifiants de base de chaque service
# (clés : username, password). Nom : <dbSecretPrefix><service>, ex. sportmatch-db-app.
dbSecretPrefix: sportmatch-db-

resources:
  requests: { cpu: 100m, memory: 384Mi }
  limits: { memory: 640Mi }

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: false
  minAvailable: 1

monitoring:
  serviceMonitor: false      # nécessite kube-prometheus-stack (CRD ServiceMonitor)

services:
  gateway:
    port: 8080
    replicas: 1
    database: false
    env:
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/sportmatch/protocol/openid-connect/certs
      APP_URI: http://sportmatch-app:8081
      EVENTS_URI: http://sportmatch-events:8082
      BUSINESS_URI: http://sportmatch-business:8083
      ADMIN_URI: http://sportmatch-admin:8084
      NOTIFICATIONS_URI: http://sportmatch-notifications:8085
      CHAT_URI: http://sportmatch-chat:8086
      CORS_ALLOWED_ORIGINS: http://localhost:3080,http://localhost:3000
  app:
    port: 8081
    replicas: 1
    database: true
  events:
    port: 8082
    replicas: 1
    database: true
  business:
    port: 8083
    replicas: 1
    database: true
  admin:
    port: 8084
    replicas: 1
    database: true
  notifications:
    port: 8085
    replicas: 1
    database: true
    env:
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
  chat:
    port: 8086
    replicas: 1
    database: true
    env:
      REDIS_HOST: redis
      REDIS_PORT: "6379"

web:
  enabled: true
  replicas: 1
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { memory: 128Mi }

ingress:
  enabled: false
  className: ""
  annotations: {}
  apiHost: api.staging.sportmatch.example
  webHost: staging.sportmatch.example
  tls: []
