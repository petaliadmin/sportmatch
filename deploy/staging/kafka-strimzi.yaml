# Kafka dans le cluster (mode kafka_mode = "strimzi", économique pour le staging).
# Prérequis : opérateur Strimzi installé dans le namespace "kafka".
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: kafka
  labels: { strimzi.io/cluster: sportmatch-kafka }
spec:
  replicas: 3
  roles: [controller, broker]
  storage:
    type: persistent-claim
    size: 20Gi
    deleteClaim: false
  resources:
    requests: { cpu: 200m, memory: 1Gi }
    limits: { memory: 1536Mi }
---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: sportmatch-kafka
  namespace: kafka
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    listeners:
      - { name: plain, port: 9092, type: internal, tls: false }
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
      num.partitions: 3
  entityOperator:
    topicOperator: {}
