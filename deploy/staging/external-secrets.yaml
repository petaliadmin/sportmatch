# Synchronise les identifiants de base (Secrets Manager → Secrets Kubernetes sportmatch-db-<service>)
# Prérequis : External Secrets Operator installé avec le rôle IRSA "external_secrets_role_arn" (sortie Terraform).
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-3
      auth:
        jwt:
          serviceAccountRef: { name: external-secrets, namespace: external-secrets }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: sportmatch-db-app
  namespace: sportmatch
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: aws-secrets-manager }
  target: { name: sportmatch-db-app }
  data:
    - secretKey: username
      remoteRef: { key: sportmatch/staging/db-app, property: username }
    - secretKey: password
      remoteRef: { key: sportmatch/staging/db-app, property: password }
---
