# Application mobile Flutter : analyse statique, tests, APK Android.
# La distribution en test fermé (Google Play, piste « internal ») s'active quand les secrets existent :
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD,
#   PLAY_SERVICE_ACCOUNT_JSON  + variables MOBILE_API_URL, MOBILE_KEYCLOAK_URL (HTTPS).
name: mobile-ci

on:
  push:
    branches: [develop, production, "feature/**", "fix/**"]
    paths: ["mobile/**", ".github/workflows/mobile-ci.yml"]
  pull_request:
    branches: [develop, production]
    paths: ["mobile/**"]
  workflow_dispatch:

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile

jobs:
  analyze-test:
    name: Analyse + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --reporter expanded

  build-apk:
    name: APK (émulateur, environnement local)
    needs: analyze-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/prepare_android.sh
      - run: flutter build apk --release --dart-define=API_URL=http://10.0.2.2:8080 --dart-define=KEYCLOAK_URL=http://10.0.2.2:8180
      - uses: actions/upload-artifact@v4
        with:
          name: sportmatch-beta-local-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

  distribute:
    name: Test fermé Google Play (piste internal)
    needs: analyze-test
    if: ${{ vars.MOBILE_API_URL != '' && github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/prepare_android.sh
      - name: Signature de publication
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<PROPS
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          PROPS
          python3 tool/patch_signing.py
      - run: >
          flutter build appbundle --release --build-number=${{ github.run_number }}
          --dart-define=API_URL=${{ vars.MOBILE_API_URL }} --dart-define=KEYCLOAK_URL=${{ vars.MOBILE_KEYCLOAK_URL }}
      - uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.sportmatch.app
          releaseFiles: mobile/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
