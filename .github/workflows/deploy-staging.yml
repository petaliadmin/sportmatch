# Livraison continue vers le staging AWS. Inactive tant que les variables du dépôt ne sont pas renseignées :
#   DOCKERHUB_NAMESPACE (ex. petaliadmin) + secrets DOCKERHUB_USERNAME / DOCKERHUB_TOKEN  → publication des images
#   STAGING_ENABLED=true, AWS_DEPLOY_ROLE_ARN, STAGING_RDS_ENDPOINT, STAGING_REDIS_ENDPOINT,
#   STAGING_API_URL, STAGING_KEYCLOAK_URL                                                → déploiement Helm sur EKS
# Déclenchée après un backend-ci vert sur develop (ou à la main).
name: deploy-staging

on:
  workflow_run:
    workflows: [backend-ci]
    types: [completed]
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # OIDC GitHub → AWS (aucune clé d'accès stockée)

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  publish:
    name: Publication des images (Docker Hub)
    if: ${{ vars.DOCKERHUB_NAMESPACE != '' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        service: [gateway, app, events, business, admin, notifications, chat, web]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Construction et publication
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service == 'web' && '.' || 'backend' }}
          file: ${{ matrix.service == 'web' && 'Dockerfile.web' || 'backend/Dockerfile' }}
          build-args: |
            MODULE=sportmatch-${{ matrix.service }}
            NEXT_PUBLIC_API_URL=${{ vars.STAGING_API_URL }}
            NEXT_PUBLIC_KEYCLOAK_URL=${{ vars.STAGING_KEYCLOAK_URL }}
          push: true
          tags: |
            ${{ vars.DOCKERHUB_NAMESPACE }}/sportmatch-${{ matrix.service }}:${{ github.event.workflow_run.head_sha || github.sha }}
            ${{ vars.DOCKERHUB_NAMESPACE }}/sportmatch-${{ matrix.service }}:develop
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Déploiement Helm sur EKS
    needs: publish
    if: ${{ vars.STAGING_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-3
      - uses: azure/setup-helm@v4
      - run: aws eks update-kubeconfig --region eu-west-3 --name sportmatch-staging
      - name: helm upgrade (déploiement progressif, retour arrière automatique en cas d'échec)
        run: |
          helm upgrade --install sportmatch deploy/helm/sportmatch -n sportmatch --create-namespace \
            -f deploy/helm/sportmatch/values-staging.yaml \
            --set image.registry=docker.io/${{ vars.DOCKERHUB_NAMESPACE }} \
            --set-string image.tag=${{ github.event.workflow_run.head_sha || github.sha }} \
            --set-string commonEnv.DB_HOST=${{ vars.STAGING_RDS_ENDPOINT }} \
            --set-string services.chat.env.REDIS_HOST=${{ vars.STAGING_REDIS_ENDPOINT }} \
            --atomic --wait --timeout 15m
      - name: Vérification
        run: curl -fsS --retry 10 --retry-delay 10 "${{ vars.STAGING_API_URL }}/actuator/health/readiness"
