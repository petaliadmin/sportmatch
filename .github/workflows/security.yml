name: security

# Analyse de sécurité : vulnérabilités des dépendances et des Dockerfiles (Trivy),
# analyse statique du code Java et TypeScript (CodeQL). Résultats dans l'onglet Security.
on:
  push:
    branches: [develop, production]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy:
    name: Trivy (dépendances, IaC, secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan du dépôt
        run: |
          docker run --rm -v "$PWD:/src" -w /src aquasec/trivy:0.57.1 fs \
            --scanners vuln,misconfig,secret --severity HIGH,CRITICAL \
            --skip-dirs node_modules,mobile/build,.next,out \
            --format sarif --output trivy.sarif --exit-code 0 .
      - name: Synthèse bloquante (CRITICAL non corrigées)
        run: |
          docker run --rm -v "$PWD:/src" -w /src aquasec/trivy:0.57.1 fs \
            --scanners vuln --severity CRITICAL --ignore-unfixed \
            --skip-dirs node_modules,mobile/build,.next,out --exit-code 1 .
      - uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy.sarif') != ''
        with:
          sarif_file: trivy.sarif
          category: trivy

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: codeql-${{ matrix.language }}
